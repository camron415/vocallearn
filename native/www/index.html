<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Halo</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fafaf9;
        color: #14202b;
        font-family: ui-rounded, system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        padding-top: calc(2rem + env(safe-area-inset-top));
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.45;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        Halo needs the internet for this build. Check cellular or Wi‑Fi, then
        reopen the app.
      </p>
    </main>
  </body>
</html>
